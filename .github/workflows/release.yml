name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify the artifacts without publishing anything"
        # Honoured by every publish step below, including against a tag.
        type: boolean
        default: true

# One host builds every target: each platform's tsgo is a plain registry
# tarball, so nothing here needs a macOS or arm runner.
jobs:
  # Build, smoke, publish are three jobs on purpose. Publishing must depend on
  # every artifact having been RUN, and only a job per platform can run them.
  build:
    runs-on: ubuntu-latest
    env:
      # No secrets in this job at all. It runs `bun install` (lifecycle scripts)
      # and the test suite from a tag, so anything with a token in scope here
      # could be read by code this repo does not own. Publishing happens in its
      # own job, below.
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned exactly, unlike ci.yml's floating "1.4". `bun build
          # --compile` embeds the Bun runtime, so this is not a build detail --
          # it is a component of the artifact users download, and "1.4" would
          # mean the released binary's runtime is whatever setup-bun happened
          # to resolve that day. CI stays floating so a Bun regression surfaces
          # on a PR rather than in a release.
          #
          # Bumping this is a deliberate act: rebuild, re-run the `package`
          # job's byte-identical check, then raise the pin. 1.4.0 -> 1.4.2 was
          # verified to leave the report unchanged.
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Every platform's tsgo, each verified against bun.lock by Bun itself.
      # --frozen-lockfile is what makes the shipped payload checkable against git.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'

      - name: The tag must match the version being released
        # A tag that disagrees with package.json ships a formula whose URLs
        # point at files the release does not contain.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || {
            echo "::error::tag v$tag does not match package.json version $pkg"; exit 1; }

      - run: bun run typecheck
      - run: bun run test

      - name: Build every target, the formula, and the npm packages
        run: |
          bun run build:all
          bun run build:formula
          bun run build:npm

      - name: Render the reference report the smoke jobs compare against
        run: bun run thicket --config tests/fixtures/sample/tsconfig.json --no-cache > from-source.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist-bin/*.tar.gz
            dist-bin/checksums.txt
            dist-bin/thicket.rb
            from-source.md
          retention-days: 7

  # Every artifact is executed on a machine of its own kind before anything is
  # published. Cross-compiling proves four binaries LINK; it says nothing about
  # whether a target-specific tsgo packaging fault ships. CI runs this matrix on
  # pull requests, but CI is not a prerequisite for a tag push and it builds with
  # a floating Bun, so the exact bytes being released have to be run here.
  smoke:
    needs: build
    name: run the ${{ matrix.target }} artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-latest
          - target: darwin-x64
            # Rosetta on arm64; macos-13 is the last native x64 image and is
            # being retired. See ci.yml for the full reasoning.
            runs-on: macos-latest
          - target: linux-x64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Run the exact tarball that is about to be published
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tarball="dist-bin/thicket-$version-${{ matrix.target }}.tar.gz"
          test -f "$tarball" || { echo "::error::no $tarball"; find . -name '*.tar.gz'; exit 1; }
          mkdir -p "$RUNNER_TEMP/prefix/bin" "$RUNNER_TEMP/prefix/libexec"
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/thicket-$version-${{ matrix.target }}"/* "$RUNNER_TEMP/prefix/libexec/"
          ln -s ../libexec/thicket "$RUNNER_TEMP/prefix/bin/thicket"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/prefix/bin/thicket" \
            --config "$GITHUB_WORKSPACE/tests/fixtures/sample/tsconfig.json" \
            --no-cache > "$GITHUB_WORKSPACE/from-binary.md"
          cd "$GITHUB_WORKSPACE"
          test -s from-binary.md
          diff -u from-source.md from-binary.md \
            || { echo "::error::refusing to release: ${{ matrix.target }} disagrees with the source run"; exit 1; }
          echo "${{ matrix.target }}: byte-identical."

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # PRESENCE, not the secrets. A step's own `env:` is not visible to its
      # `if:`, so the gate reads these; the tokens themselves appear only in
      # the single step that uses each one.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Restage the npm packages from the smoke-tested tarballs
        # Rebuilt from the DOWNLOADED tarballs, not recompiled: the bytes npm
        # publishes are then the same ones the matrix above just ran.
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for t in dist-bin/*.tar.gz; do tar -xzf "$t" -C dist-bin; done
          bun install --frozen-lockfile
          bun run build:npm

      - name: Publish the GitHub release
        # Gated on the repository too. A fork pushing a tag runs this with its
        # own token and would cut a release in the fork -- harmless, but it
        # contradicts the promise that a fork builds, verifies and stops.
        if: >-
          startsWith(github.ref, 'refs/tags/v') && env.DRY_RUN != 'true'
          && github.repository == 'alecf/thicket'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist-bin/*.tar.gz dist-bin/checksums.txt dist-bin/thicket.rb

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_NPM_TOKEN == 'true' && env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          me=$(npm whoami)
          version=$(node -p "require('./package.json').version")

          # Preflight EVERY name before publishing any of them. The unscoped
          # `thicket` is held by an unrelated package today, and a platform
          # package could be taken too -- publishing four and failing on the
          # fifth would strand them on the registry at a version that can never
          # be republished, pointing at a thin package that does not exist.
          for dir in dist-npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name" version > /dev/null 2>&1; then
              if ! npm owner ls "$name" 2>/dev/null | grep -qE "^$me <"; then
                echo "::warning::npm package '$name' exists and is not owned by $me."
                echo "::warning::Skipping ALL npm publishing; the GitHub release and tap are unaffected."
                exit 0
              fi
            fi
          done

          # Platform packages first: the thin package's optionalDependencies
          # name versions that must already resolve when someone installs it.
          publish() {
            local dir=$1
            local name
            name=$(node -p "require('./$dir/package.json').name")
            # Idempotent, so a run that failed halfway can be retried rather
            # than needing a version bump to get unstuck.
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              return
            fi
            (cd "$dir" && npm publish --access public)
          }
          for dir in dist-npm/thicket-*; do publish "$dir"; done
          publish dist-npm/thicket

      - name: Push the formula to the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_TAP_TOKEN == 'true' && env.DRY_RUN != 'true'
        env:
          # The token lives HERE and nowhere else, so no other step in this job
          # -- notably `bun install` and the test run -- has it in scope.
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          # A shared personal tap, not a per-tool one: a tap holds any number
          # of formulae, and renaming later forces every user to re-tap. Only
          # Formula/thicket.rb is written and staged below, by name, so a
          # sibling tool's formula in the same tap cannot be clobbered.
          TAP_REPO: ${{ vars.TAP_REPO || 'alecf/homebrew-tap' }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Formula
          cp dist-bin/thicket.rb tap/Formula/thicket.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/thicket.rb
          git diff --staged --quiet || git commit -m "thicket ${GITHUB_REF#refs/tags/v}"
          # `-u origin HEAD` rather than a bare push: cloning a tap that has no
          # commits yet leaves an unborn branch with no upstream, and a bare
          # push there fails with "has no upstream branch".
          git push -u origin HEAD
