version: 2

# Bun dependencies are not covered. Dependabot's bun updater reads `bun.lock`,
# and it supports `lockfileVersion` up to 1. This repo requires Bun >=1.4, which
# writes version 2. The updater fails the whole job on it:
#
#   Dependabot::DependencyFileNotSupported
#   Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock.
#   The bun version Dependabot runs supports up to 1.
#
# A weekly job that always fails teaches readers to ignore a red mark, so the
# entry is out rather than commented in place. Downgrading the lockfile is not
# the trade: Bun >=1.4 is a requirement, not an accident.
#
# Add the entry back once Dependabot's bun updater reads version 2. Nothing else
# has to change:
#
#   - package-ecosystem: bun
#     directory: /
#     schedule: { interval: weekly, day: monday }
#     open-pull-requests-limit: 5
#     commit-message: { prefix: chore, prefix-development: chore }
#     groups:
#       dependencies: { patterns: ["*"], update-types: [minor, patch] }
#     ignore:
#       - dependency-name: typescript   # see AGENTS.md, non-negotiable 2
#
# Until then, bump `xxhash-wasm`, `@types/node` and `vitest` by hand. Leave
# `typescript` alone. AGENTS.md non-negotiable 2 says why.

updates:
  # Workflow actions are pinned to release tags, so Dependabot rewrites the
  # tag in place.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
